# Simulation profile only. Real vehicle measurements/tuning are not inferred.
hege_px4_bridge:
  ros__parameters:
    rate_hz: 20.0
    cmd_timeout: 0.5
    status_timeout: 2.0
    attitude_timeout: 0.5
    command_ack_timeout: 1.5
    wheel_base: 1.90
    max_steering_angle: 0.5759
    max_speed: 1.0
    max_yaw_rate: 0.75
    min_moving_speed: 0.05
    px4_yaw_p: 3.0
    cmd_vel_topic: /cmd_vel/selected
    vehicle_status_topic: /fmu/out/vehicle_status_v1
    vehicle_command_ack_topic: /fmu/out/vehicle_command_ack
    allow_remote_vehicle_commands: true
